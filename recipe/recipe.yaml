context:
  version: "3.2.0.post1"

package:
  name: zxing-cpp-python
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/z/zxing-cpp/zxing_cpp-${{ version }}.tar.gz
    sha256: 3100a9abf498eeca4f271c7033ea66ed3e936983ed4bf8ace72a3e1efd2062de
    patches:
      # upstream sdist already ships zxing.cmake/LICENSE; don't try to copy them from ../../
      - 0001-skip-copy-from-parent-in-sdist.patch

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake >=3.21
    - if: not win
      then:
        - make
    - if: build_platform != host_platform
      then:
        - cross-python_${{ host_platform }}
        - python
        - scikit-build-core
        - nanobind
  host:
    - python
    - scikit-build-core >=0.12
    - nanobind >=2.11.0
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - zxingcpp
      pip_check: true

about:
  homepage: https://github.com/zxing-cpp/zxing-cpp/
  summary: Python bindings for the zxing-cpp barcode library
  documentation: https://github.com/zxing-cpp/zxing-cpp/blob/master/wrappers/python/README.md
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
    - carlodri
